version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalscope-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - MODEL_CONFIG=model/configs/default.yaml
    volumes:
      - ./checkpoints:/workspace/checkpoints:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
